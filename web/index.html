<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Языки мира — интерактивный атлас</title>
<meta name="description" content="Интерактивный атлас языков мира: поиск по 8000 языков, семьи, число носителей, статус угрозы исчезновения, карта и материалы для изучения.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="title-block">
    <h1 data-i18n="h1">Языки мира</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="header-controls">
    <select id="lang-select" class="lang-select" aria-label="Interface language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
    <button id="theme-toggle" class="icon-btn" title="" aria-label="">◐</button>
  </div>
</header>

<section class="toolbar" aria-label="Search and filters">
  <input id="search" type="search" autocomplete="off">
  <select id="f-macroarea"></select>
  <select id="f-family"></select>
  <select id="f-country"></select>
  <select id="f-speakers">
    <option value="" data-i18n="spkAny"></option>
    <option value="5" data-i18n="spk5"></option>
    <option value="4" data-i18n="spk4"></option>
    <option value="3" data-i18n="spk3"></option>
    <option value="2" data-i18n="spk2"></option>
    <option value="1" data-i18n="spk1"></option>
    <option value="0" data-i18n="spk0"></option>
  </select>
  <select id="f-med">
    <option value="" data-i18n="matAny"></option>
    <option value="g" data-i18n="matG"></option>
    <option value="s" data-i18n="matS"></option>
    <option value="d" data-i18n="matD"></option>
    <option value="n" data-i18n="matN"></option>
  </select>
  <button id="reset" class="ghost-btn" data-i18n="reset"></button>
</section>

<section class="status-row" aria-label="Endangerment status filter">
  <span class="status-row-label" data-i18n="statusLabel"></span>
  <div id="status-chips" class="chips" role="group"></div>
  <span id="result-count" class="result-count" aria-live="polite"></span>
</section>

<main class="content">
  <section class="table-pane" aria-label="Language list">
    <div class="table-scroll" id="table-scroll">
      <table id="lang-table">
        <thead>
          <tr>
            <th data-sort="name" class="sortable"><span data-i18n="thLang"></span><span class="sort-arrow"></span></th>
            <th data-sort="fam" class="sortable"><span data-i18n="thFam"></span><span class="sort-arrow"></span></th>
            <th data-sort="ma" class="sortable hide-narrow"><span data-i18n="thRegion"></span><span class="sort-arrow"></span></th>
            <th data-sort="spk" class="sortable num"><span data-i18n="thSpeakers"></span><span class="sort-arrow"></span></th>
            <th data-sort="aes" class="sortable"><span data-i18n="thStatus"></span><span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="table-sentinel"></div>
    </div>
  </section>

  <section class="map-pane" aria-label="Language map">
    <div id="map"></div>
    <div id="legend" class="legend" aria-hidden="false"></div>
  </section>
</main>

<aside id="detail" class="detail" hidden aria-label="Language card">
  <button id="detail-close" class="icon-btn detail-close" aria-label="Close">✕</button>
  <div id="detail-body"></div>
</aside>

<footer class="site-footer" id="footer"></footer>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
