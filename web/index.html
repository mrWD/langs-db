<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Языки мира — интерактивный атлас</title>
<meta name="description" content="Интерактивный атлас языков мира: поиск по 8000 языков, семьи, число носителей, статус угрозы исчезновения, карта и материалы для изучения.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="title-block">
    <h1>Языки мира</h1>
    <p class="subtitle">Интерактивный атлас: <span id="total-count">…</span> языков — семьи, носители, статус угрозы, карта и материалы для изучения</p>
  </div>
  <button id="theme-toggle" class="icon-btn" title="Переключить тему" aria-label="Переключить тему">◐</button>
</header>

<section class="toolbar" aria-label="Поиск и фильтры">
  <input id="search" type="search" placeholder="Поиск: алтайский, ainu, ket, Turkic…" autocomplete="off">
  <select id="f-macroarea" aria-label="Макрорегион"></select>
  <select id="f-family" aria-label="Языковая семья"></select>
  <select id="f-country" aria-label="Страна"></select>
  <select id="f-speakers" aria-label="Число носителей">
    <option value="">Носители: любые</option>
    <option value="5">&gt; 1 млн</option>
    <option value="4">100 тыс. – 1 млн</option>
    <option value="3">10–100 тыс.</option>
    <option value="2">1–10 тыс.</option>
    <option value="1">&lt; 1 тыс.</option>
    <option value="0">нет данных</option>
  </select>
  <select id="f-med" aria-label="Степень описанности">
    <option value="">Материалы: любые</option>
    <option value="g">Есть грамматика</option>
    <option value="s">Хотя бы очерк грамматики</option>
    <option value="d">Хотя бы тексты / словарь</option>
    <option value="n">Почти не описан</option>
  </select>
  <button id="reset" class="ghost-btn" title="Сбросить все фильтры">Сбросить</button>
</section>

<section class="status-row" aria-label="Фильтр по статусу угрозы">
  <span class="status-row-label">Статус:</span>
  <div id="status-chips" class="chips" role="group"></div>
  <span id="result-count" class="result-count" aria-live="polite"></span>
</section>

<main class="content">
  <section class="table-pane" aria-label="Список языков">
    <div class="table-scroll" id="table-scroll">
      <table id="lang-table">
        <thead>
          <tr>
            <th data-sort="name" class="sortable">Язык<span class="sort-arrow"></span></th>
            <th data-sort="fam" class="sortable">Семья<span class="sort-arrow"></span></th>
            <th data-sort="ma" class="sortable hide-narrow">Регион<span class="sort-arrow"></span></th>
            <th data-sort="spk" class="sortable num">Носители<span class="sort-arrow"></span></th>
            <th data-sort="aes" class="sortable">Статус<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="table-sentinel"></div>
    </div>
  </section>

  <section class="map-pane" aria-label="Карта языков">
    <div id="map"></div>
    <div id="legend" class="legend" aria-hidden="false"></div>
  </section>
</main>

<aside id="detail" class="detail" hidden aria-label="Карточка языка">
  <button id="detail-close" class="icon-btn detail-close" aria-label="Закрыть">✕</button>
  <div id="detail-body"></div>
</aside>

<footer class="site-footer">
  Данные: <a href="https://glottolog.org" target="_blank" rel="noopener">Glottolog 5.x</a> (CC BY 4.0) ·
  <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a> (CC0) ·
  сборка <span id="generated-date"></span> ·
  статус угрозы — шкала AES (Glottolog: ElCat / Ethnologue / UNESCO)
</footer>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
