name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The stats workflow commits with GITHUB_TOKEN, and GitHub never starts another workflow
  # from such a push, so its commits sat in main without reaching the site (it stayed on
  # the last human push). workflow_run is exempt from that rule: deploy after it finishes.
  workflow_run:
    workflows: ['Collect visit stats']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version assets by commit so browsers never mix old and new files
        run: sed -i "s/?v=[A-Za-z0-9._-]*/?v=${GITHUB_SHA::8}/g" web/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
