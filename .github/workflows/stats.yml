name: Collect visit stats

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read counters from Abacus
        run: python3 data/collect_stats.py
      - name: Commit stats.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/stats.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Статистика посещений на $(date -u +%Y-%m-%d)"
          git push
